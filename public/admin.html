<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>tonight.vibe admin</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #0a0a0a; color: #e8e2d4; font-family: monospace; padding: 2rem; }
h1 { font-size: 18px; margin-bottom: 2rem; color: #c8f25e; }
.form { background: #161616; border: 1px solid #2a2a2a; border-radius: 10px; padding: 1.5rem; margin-bottom: 2rem; }
input, textarea { width: 100%; background: #0a0a0a; border: 1px solid #333; color: #e8e2d4; padding: 8px; border-radius: 6px; font-family: monospace; font-size: 13px; margin-bottom: 10px; }
button { background: #c8f25e; color: #0a0a0a; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; margin-right: 8px; }
.place-card { background: #161616; border: 1px solid #2a2a2a; border-radius: 8px; padding: 1rem; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
.delete-btn { background: #ff4444; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
label { font-size: 11px; color: #555; letter-spacing: 1px; display: block; margin-bottom: 4px; }
#login-screen { max-width: 300px; margin: 100px auto; }
#main-screen { display: none; }
</style>
</head>
<body>
<div id="login-screen">
  <h1>tonight.vibe / admin</h1>
  <br>
  <label>PASSWORD</label>
  <input type="password" id="password" placeholder="..." />
  <br><br>
  <button onclick="login()">Enter</button>
</div>

<div id="main-screen">
  <h1>tonight.vibe / admin</h1>
  <div class="form">
    <label>NAME</label><input id="name" placeholder="Poing" />
    <label>VIBE (comma separated)</label><input id="vibe" placeholder="underground, raw" />
    <label>MUSIC (comma separated)</label><input id="music" placeholder="techno, house" />
    <label>NOTES</label><textarea id="notes" rows="2"></textarea>
    <label>PRICE LEVEL (1-3)</label><input id="price" type="number" value="2" />
    <label>OPEN LATE (true/false)</label><input id="open_late" value="true" />
    <br><button onclick="addPlace()">+ Add Place</button>
  </div>
  <div id="places-list"></div>
</div>

<script>
let PASSWORD = '';

function login() {
  PASSWORD = document.getElementById('password').value;
  fetch('/places', { headers: { 'x-admin-password': PASSWORD } })
    .then(r => { if (r.ok) { document.getElementById('login-screen').style.display='none'; document.getElementById('main-screen').style.display='block'; load(); loadEvents(); } else { alert('Wrong password'); } });
}

async function load() {
  const res = await fetch('/places');
  const places = await res.json();
  document.getElementById('places-list').innerHTML = places.map(p =>
    '<div class="place-card"><div><strong>' + p.name + '</strong><span style="color:#666;font-size:12px;margin-left:10px">' + (p.vibe||[]).join(', ') + '</span></div><button class="delete-btn" onclick="deletePlace(' + p.id + ')">delete</button></div>'
  ).join('');
}

async function addPlace() {
  const body = { name: document.getElementById('name').value, city: 'Rotterdam', vibe: document.getElementById('vibe').value.split(',').map(s=>s.trim()), music: document.getElementById('music').value.split(',').map(s=>s.trim()), notes: document.getElementById('notes').value, price_level: parseInt(document.getElementById('price').value), open_late: document.getElementById('open_late').value === 'true' };
  await fetch('/admin/places', { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-admin-password': PASSWORD }, body: JSON.stringify(body) });
  load(); loadEvents();
}

async function deletePlace(id) {
  await fetch('/admin/places/' + id, { method: 'DELETE', headers: { 'x-admin-password': PASSWORD } });
  load(); loadEvents();
}
</script>

<h2 style="font-family:'Bebas Neue',sans-serif;letter-spacing:2px;color:#b8f250;margin-bottom:1rem;font-size:20px;">EVENTS</h2>
<div class="form">
  <label>EVENT NAME</label><input id="ename" placeholder="Awakenings Festival" />
  <label>VENUE</label><input id="evenue" placeholder="Maassilo" />
  <label>CITY</label><input id="ecity" value="Rotterdam" />
  <label>DATE (YYYY-MM-DD)</label><input id="edate" placeholder="2026-05-10" />
  <label>ARTISTS (comma separated)</label><input id="eartists" placeholder="Charlotte de Witte, Amelie Lens" />
  <label>GENRE (comma separated)</label><input id="egenre" placeholder="techno, house" />
  <label>PRICE (euros)</label><input id="eprice" type="number" value="15" />
  <label>TICKET URL</label><input id="eurl" placeholder="https://..." />
  <br><button onclick="addEvent()">+ Add Event</button>
</div>
<div id="events-list"></div>
<script>
async function loadEvents() {
  const res = await fetch('/events');
  const evs = await res.json();
  document.getElementById('events-list').innerHTML = evs.length === 0 ? '<p style="color:#444;font-size:12px">No events yet.</p>' : evs.map(e =>
    '<div class="place-card"><div><strong>' + e.name + '</strong><span style="color:#666;font-size:12px;margin-left:10px">' + e.venue + ' — ' + e.date + '</span></div><button class="delete-btn" onclick="deleteEvent(' + e.id + ')">delete</button></div>'
  ).join('');
}

async function addEvent() {
  const body = {
    name: document.getElementById('ename').value,
    venue: document.getElementById('evenue').value,
    city: document.getElementById('ecity').value,
    date: document.getElementById('edate').value,
    artists: document.getElementById('eartists').value.split(',').map(s=>s.trim()),
    genre: document.getElementById('egenre').value.split(',').map(s=>s.trim()),
    price: parseInt(document.getElementById('eprice').value),
    url: document.getElementById('eurl').value
  };
  await fetch('/admin/events', { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-admin-password': PASSWORD }, body: JSON.stringify(body) });
  loadEvents();
}

async function deleteEvent(id) {
  await fetch('/admin/events/' + id, { method: 'DELETE', headers: { 'x-admin-password': PASSWORD } });
  loadEvents();
}
</script>
<h2 style="font-family:'Bebas Neue',sans-serif;letter-spacing:2px;color:#b8f250;margin-bottom:1rem;font-size:20px;margin-top:2rem;">UPLOAD EVENTS (EXCEL)</h2>
<div class="form">
  <label>VENUE NAME (must match exactly)</label>
  <input id="uvenue" placeholder="Poing" />
  <label>CITY</label>
  <input id="ucity" value="Rotterdam" />
  <label>EXCEL FILE</label>
  <input type="file" id="ufile" accept=".xlsx" style="color:#d4cfc5" />
  <br><br>
  <button onclick="uploadExcel()">Upload Excel</button>
  <div id="upload-result" style="margin-top:12px;font-size:12px;color:#666;"></div>
</div>
<script>
async function uploadExcel() {
  const venue = document.getElementById('uvenue').value;
  const city = document.getElementById('ucity').value;
  const file = document.getElementById('ufile').files[0];
  if (!venue || !file) { alert('Venue and file required'); return; }
  const formData = new FormData();
  formData.append('file', file);
  formData.append('venue', venue);
  formData.append('city', city);
  const res = await fetch('/admin/upload-events', {
    method: 'POST',
    headers: { 'x-admin-password': PASSWORD },
    body: formData
  });
  const result = await res.json();
  let msg = result.added + ' events added.';
  if (result.duplicates && result.duplicates.length > 0) {
    msg += ' Duplicates skipped: ' + result.duplicates.join(', ');
  }
  document.getElementById('upload-result').textContent = msg;
  loadEvents();
}
</script></body>
</html>
